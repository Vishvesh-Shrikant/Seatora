version: '3.8'

services:
  # ─── Redis Data Store & Message Broker ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: seatora-redis
    command: redis-server --appendonly yes --notify-keyspace-events KEA
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seatora-network
    restart: unless-stopped

  # ─── Spring Boot Backend Application ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seatora-backend
    ports:
      - "8080:8080"    
    depends_on:
      - redis
    env_file:
      - .env          
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=${DB_URI}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_TEST_API_KEY=${RAZORPAY_TEST_API_KEY}
      - RAZORPAY_TEST_API_SECRET=${RAZORPAY_TEST_API_SECRET}
    networks:
      - seatora-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  seatora-network:
    driver: bridge